<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Laura Hadyk — Immobilien im Ruhrgebiet</title>
  <meta name="description" content="Immobilienverkauf & Verwaltung im Ruhrgebiet. Unverbindlich per WhatsApp anfragen." />

  <style>
    :root{
      --bg:#0b0f17;
      --card:#121a28;
      --text:#eef3ff;
      --muted:#b7c4de;
      --accent:#caa46a;
      --border: rgba(255,255,255,.10);
      --shadow: 0 18px 55px rgba(0,0,0,.45);
      --r:22px;
      --max: 1080px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      background:
        radial-gradient(900px 520px at 22% 18%, rgba(202,164,106,.22), transparent 60%),
        radial-gradient(900px 520px at 82% 10%, rgba(120,180,255,.14), transparent 60%),
        var(--bg);
      min-height: 150vh; /* damit man scrollen kann /
    }
    .wrap{max-width:var(--max); margin:0 auto; padding:26px 18px 56px;}
    header{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:20px;}
    .brand{display:flex; gap:10px; align-items:center;}
    .dot{width:10px;height:10px;border-radius:999px;background:linear-gradient(135deg,var(--accent),#f1d7a5);box-shadow:0 0 0 6px rgba(202,164,106,.14);}
    .brand b{display:block;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--muted)}
    .brand span{display:block;font-weight:800;font-size:14px;letter-spacing:.02em}

    .hero{
      display:grid;
      grid-template-columns: 1.15fr .85fr;
      gap:22px;
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid var(--border);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      padding:28px;
      align-items:center;
    }

    .kicker{
      display:inline-flex;
      gap:10px;
      align-items:center;
      padding:8px 12px;
      border:1px solid var(--border);
      border-radius:999px;
      color:var(--muted);
      font-size:12px;
      letter-spacing:.06em;
      text-transform:uppercase;
      background:rgba(18,26,40,.55);
      width:max-content;
    }

    h1{margin:14px 0 10px; font-size:44px; line-height:1.05; letter-spacing:-.02em;}
    .sub{margin:0 0 18px; color:var(--muted); font-size:16px; line-height:1.55; max-width:56ch;}

    .bullets{display:grid; gap:10px; margin:18px 0 22px; padding:0; list-style:none;}
    .bullets li{display:flex; gap:10px; align-items:flex-start; color:var(--muted); font-size:14px; line-height:1.5;}
    .check{
      width:18px;height:18px;border-radius:6px;
      background:rgba(202,164,106,.18);
      border:1px solid rgba(202,164,106,.35);
      display:inline-flex;align-items:center;justify-content:center;
      color:#f1d7a5;flex:0 0 auto;margin-top:1px;
      font-size:12px;font-weight:900;
    }

    .ctaRow{display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      gap:10px;
      padding:13px 16px;
      border-radius:999px;
      border:1px solid rgba(202,164,106,.42);
      background: linear-gradient(135deg, rgba(202,164,106,.30), rgba(241,215,165,.14));
      color:var(--text);
      text-decoration:none;
      font-weight:800;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      transition: transform .15s ease, filter .15s ease;
      min-width: 240px;
    }
    .btn:hover{transform: translateY(-1px); filter: brightness(1.05);}
    .hint{color:var(--muted); font-size:12px}

    .card{
      background: rgba(18,26,40,.65);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
    }
    .portrait{
      width:100%;
      aspect-ratio: 4/5;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.10);
      overflow:hidden;
      background:#0f1624;

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laura Hadyk Immobilien - Kontakt</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a2540 0%, #1a4d7a 100%);
      color: #333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      width: 100%;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      background: linear-gradient(135deg, #0a2540 0%, #1a4d7a 100%);
      padding: 40px 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    .logo-container {
      position: relative;
      z-index: 1;
      margin-bottom: 20px;
    }

    .logo {
      width: 180px;
      height: auto;
      filter: brightness(0) invert(1);
      margin: 0 auto;
      display: block;
    }

    .header h1 {
      color: #f5f1e8;
      font-size: 2.2em;
      margin-bottom: 10px;
      font-weight: 300;
      letter-spacing: 2px;
      position: relative;
      z-index: 1;
    }

    .header p {
      color: #f5f1e8;
      font-size: 1.1em;
      opacity: 0.9;
      position: relative;
      z-index: 1;
    }

    .content {
      padding: 50px 40px;
      text-align: center;
    }

    .profile-section {
      margin-bottom: 40px;
    }

    .profile-image {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 25px;
      display: block;
      border: 5px solid #f5f1e8;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease;
    }

    .profile-image:hover {
      transform: scale(1.05);
    }

    .content h2 {
      color: #0a2540;
      font-size: 1.8em;
      margin-bottom: 15px;
      font-weight: 400;
    }

    .content p {
      color: #555;
      font-size: 1.1em;
      line-height: 1.6;
      margin-bottom: 35px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 18px 45px;
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-size: 1.2em;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4);
      position: relative;
      overflow: hidden;
    }

    .cta-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s;
    }

    .cta-button:hover::before {
      left: 100%;
    }

    .cta-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(37, 211, 102, 0.5);
    }

    .cta-button:active {
      transform: translateY(-1px);
    }

    .whatsapp-icon {
      width: 28px;
      height: 28px;
      margin-right: 12px;
      fill: white;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 25px;
      margin-top: 50px;
      padding: 30px 0;
    }

    .feature {
      padding: 20px;
      text-align: center;
    }

    .feature-icon {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    .feature h3 {
      color: #0a2540;
      font-size: 1.1em;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .feature p {
      color: #666;
      font-size: 0.95em;
      margin: 0;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 1.6em;
      }
      
      .content {
        padding: 35px 25px;
      }

      .content h2 {
        font-size: 1.4em;
      }

      .profile-image {
        width: 150px;
        height: 150px;
      }

      .features {
        grid-template-columns: 1fr;
        gap: 15px;
      }
    }

    /* Image Upload Styling */
    .upload-section {
      margin: 20px 0;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 10px;
      border: 2px dashed #0a2540;
    }

    .upload-btn {
      padding: 10px 20px;
      background: #0a2540;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
    }

    .upload-btn:hover {
      background: #1a4d7a;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>
